version: "3"

vars:
  DEST: '{{.DEST | default "."}}'
  WORK: '{{.WORK}}'
  REPO: https://github.com/ggml-org/llama.cpp.git
  JOBS:
    sh: sysctl -n hw.logicalcpu 2>/dev/null || echo 8

tasks:
  default:
    desc: Build the latest standalone llama-tts (Apple Silicon, Metal) into DEST
    platforms: [darwin]
    cmds:
      - defer: rm -rf "{{.WORK}}/src" "{{.WORK}}/build" "{{.WORK}}/install"
      - task: build
      - task: install

  cleanup:
    desc: Remove clone and build trees so only installed binaries remain
    cmds:
      - |
        rm -rf "{{.WORK}}/src" "{{.WORK}}/build" "{{.WORK}}/install"

  build:
    internal: true
    cmds:
      - |
        set -euo pipefail
        test -n "{{.WORK}}"
        test -d "{{.DEST}}"
        command -v git >/dev/null
        command -v cmake >/dev/null
        SRC="{{.WORK}}/src"
        BUILD="{{.WORK}}/build"
        rm -rf "$SRC" "$BUILD"
        REF="$(git ls-remote --tags --refs "{{.REPO}}" | awk -F/ '$NF ~ /^b[0-9]+$/ {print $NF}' | sort -V | tail -1)"
        echo "llama.cpp latest build tag: ${REF:-HEAD}"
        if [ -n "$REF" ]; then
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$REF" "{{.REPO}}" "$SRC"
        else
          git clone --depth 1 --recurse-submodules --shallow-submodules "{{.REPO}}" "$SRC"
        fi
        GEN=()
        if command -v ninja >/dev/null 2>&1; then GEN=(-G Ninja); fi
        cmake -S "$SRC" -B "$BUILD" "${GEN[@]}" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DBUILD_SHARED_LIBS=OFF \
          -DGGML_METAL=ON \
          -DGGML_METAL_EMBED_LIBRARY=ON \
          -DGGML_CCACHE=OFF \
          -DGGML_OPENMP=OFF \
          -DLLAMA_OPENSSL=OFF \
          -DLLAMA_CURL=OFF \
          -DLLAMA_BUILD_TESTS=OFF \
          -DLLAMA_BUILD_EXAMPLES=ON \
          -DLLAMA_BUILD_TOOLS=OFF \
          -DLLAMA_BUILD_SERVER=OFF
        cmake --build "$BUILD" --config Release --target llama-tts --parallel "{{.JOBS}}"

  install:
    internal: true
    cmds:
      - |
        set -euo pipefail
        BIN="$(find "{{.WORK}}/build" -type f -name llama-tts -perm -111 | head -n 1)"
        test -n "$BIN"
        install -m 0755 "$BIN" "{{.DEST}}/llama-tts"
        strip -x "{{.DEST}}/llama-tts" || true
        echo "installed {{.DEST}}/llama-tts"

version: "3"

vars:
  DEST: '{{.DEST | default "."}}'
  WORK: '{{.WORK}}'
  REPO: https://github.com/mmwillet/TTS.cpp.git
  JOBS:
    sh: sysctl -n hw.logicalcpu 2>/dev/null || echo 8

tasks:
  default:
    desc: Build the latest standalone tts.cpp CLI (Apple Silicon, Metal) into DEST
    platforms: [darwin]
    cmds:
      - defer: rm -rf "{{.WORK}}/src" "{{.WORK}}/build" "{{.WORK}}/install"
      - task: build
      - task: install

  cleanup:
    desc: Remove clone and build trees so only installed binaries remain
    cmds:
      - |
        rm -rf "{{.WORK}}/src" "{{.WORK}}/build" "{{.WORK}}/install"

  build:
    internal: true
    cmds:
      - |
        set -euo pipefail
        test -n "{{.WORK}}"
        test -d "{{.DEST}}"
        command -v git >/dev/null
        command -v cmake >/dev/null
        SRC="{{.WORK}}/src"
        BUILD="{{.WORK}}/build"
        rm -rf "$SRC" "$BUILD"
        git clone --depth 1 --recurse-submodules --shallow-submodules "{{.REPO}}" "$SRC"
        echo "TTS.cpp commit: $(git -C "$SRC" rev-parse --short HEAD)"
        GEN=()
        if command -v ninja >/dev/null 2>&1; then GEN=(-G Ninja); fi
        cmake -S "$SRC" -B "$BUILD" "${GEN[@]}" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DBUILD_SHARED_LIBS=OFF \
          -DTTS_BUILD_EXAMPLES=ON \
          -DTTS_CLI_SDL=OFF \
          -DGGML_METAL=ON \
          -DGGML_METAL_EMBED_LIBRARY=ON \
          -DGGML_CCACHE=OFF \
          -DGGML_OPENMP=OFF
        cmake --build "$BUILD" --config Release --target tts-cli --parallel "{{.JOBS}}"

  install:
    internal: true
    cmds:
      - |
        set -euo pipefail
        BIN="$(find "{{.WORK}}/build" -type f -name tts-cli -perm -111 | head -n 1)"
        test -n "$BIN"
        install -m 0755 "$BIN" "{{.DEST}}/tts.cpp"
        strip -x "{{.DEST}}/tts.cpp" || true
        echo "installed {{.DEST}}/tts.cpp"
